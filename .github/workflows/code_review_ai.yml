
name: AI Pull Request Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - 'dags/**'
      - 'modules/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest

    if: github.event.pull_request.draft == false

    timeout-minutes: 30

    steps:
      - name: Run PR-Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

          # Your own inference server
          OPENAI_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI.API_BASE: ${{ secrets.LLM_API_BASE }}

          # Model configuration
          config.model: "openai/qwen3-8-27b"
          config.fallback_models: '[]'
          config.custom_model_max_tokens: "32768"

          # Automatic review on PR creation
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"

          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'

          # Automatic review on new commits
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'

          # Review configuration
          pr_reviewer.extra_instructions: |
            Act as a senior software engineer.

            Focus on:
            - Functional bugs
            - Security vulnerabilities
            - Performance issues
            - Race conditions
            - Incorrect error handling
            - Architectural problems

            Only report actionable findings.
            Do not report stylistic preferences.
            Explain the impact of every finding.
            Avoid false positives.
